<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#041319">
  <title>Symphony Watchtower</title>
  <link rel="stylesheet" href="/assets/dashboard.css">
<style>
/* Owner attention block - the first thing on the page, and the only thing most
   visits need to read. Semantic colour is paired with a word in every state. */
.attention{border-radius:20px;padding:22px 24px;margin-bottom:18px;border:1px solid;display:flex;flex-direction:column;gap:8px}
.attention.att-clear{border-color:rgba(94,234,190,.35);background:rgba(16,84,68,.28)}
.attention.att-warn{border-color:rgba(240,180,88,.4);background:rgba(92,64,16,.3)}
.attention.att-down{border-color:rgba(240,140,140,.45);background:rgba(96,28,28,.32)}
.att-word{font-family:ui-monospace,Consolas,monospace;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.9}
.attention.att-clear .att-word{color:#7ee0c0}
.attention.att-warn .att-word{color:#f2c274}
.attention.att-down .att-word{color:#f5a3a3}
.att-headline{font-size:26px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:0;color:#fff;text-wrap:balance}
.att-detail{margin:0;font-size:15px;line-height:1.6;color:rgba(226,232,240,.82);max-width:70ch}
.att-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.att-item{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.05);border-radius:12px;padding:11px 13px}
.att-sev{font-family:ui-monospace,Consolas,monospace;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:5px;white-space:nowrap;margin-top:2px}
.att-sev.att-warn{color:#f2c274;background:rgba(240,180,88,.14)}
.att-sev.att-down{color:#f5a3a3;background:rgba(240,140,140,.16)}
.att-item-label{font-weight:600;color:#fff;font-size:15px}
.att-item-detail{font-size:13.5px;color:rgba(226,232,240,.72);margin-top:2px}
.rm-list{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.rm-row{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid rgba(255,255,255,.07);font-size:14.5px;color:rgba(226,232,240,.85)}
.rm-row:first-child{border-top:0}
.rm-status{font-family:ui-monospace,Consolas,monospace;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:2px 7px;border-radius:4px;min-width:62px;text-align:center;white-space:nowrap}
.rm-done .rm-status{color:#7ee0c0;background:rgba(94,234,190,.13)}
.rm-active .rm-status{color:#f2c274;background:rgba(240,180,88,.15)}
.rm-planned .rm-status{color:rgba(148,163,184,.9);background:rgba(148,163,184,.12)}
.rm-ms{font-family:ui-monospace,Consolas,monospace;font-size:12px;font-weight:600;color:#fff;min-width:34px}
.rm-title{flex:1;min-width:0}
.rm-done .rm-title{color:rgba(226,232,240,.62)}
</style>
</head>
<body>
  <div class="pointer-events-none fixed inset-0 overflow-hidden">
    <div class="absolute inset-0 mesh-overlay opacity-30"></div>
    <div class="absolute -left-20 top-24 h-72 w-72 rounded-full bg-cyan-400/10 blur-3xl animate-drift"></div>
    <div class="absolute right-0 top-10 h-80 w-80 rounded-full bg-emerald-400/10 blur-3xl animate-drift"></div>
    <div class="absolute bottom-0 left-1/2 h-96 w-96 -translate-x-1/2 rounded-full bg-orange-400/10 blur-3xl animate-drift"></div>
  </div>

  <div class="relative min-h-screen">
    <div class="dashboard-shell">
      <header id="hero-panel" class="panel animate-lift"></header>
      <div id="dashboard-alert" class="mt-4"></div>
      <section id="workflow-editor" class="panel mt-6"></section>

      <main class="mt-6 grid gap-6 xl:grid-cols-[minmax(0,1.35fr)_420px] xl:items-start">
        <section class="space-y-6">
          <section id="metric-grid" class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3"></section>
          <div class="grid gap-6 lg:grid-cols-[minmax(0,1.15fr)_minmax(0,0.85fr)]">
            <section id="live-runs" class="panel"></section>
            <section id="issue-distribution" class="panel"></section>
          </div>
          <div class="grid gap-6 lg:grid-cols-[minmax(0,1.05fr)_minmax(0,0.95fr)]">
            <section id="activity-feed" class="panel"></section>
            <section id="tracked-issues" class="panel"></section>
          </div>
        </section>

        <aside class="dashboard-rail space-y-6">
          <section id="issue-detail" class="panel"></section>
          <section id="instance-status" class="panel"></section>
          <section id="rate-limits" class="panel"></section>
        </aside>
      </main>
    </div>
  </div>

  <noscript>
    <div class="mx-auto max-w-3xl px-4 py-10 text-sm text-slate-200">
      Symphony Watchtower requires JavaScript to render live runtime state.
    </div>
  </noscript>

  <script type="module" src="/assets/dashboard.js"></script>
</body>
</html>
