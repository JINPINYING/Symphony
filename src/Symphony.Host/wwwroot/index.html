<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#041319">
  <title>Symphony Watchtower</title>
  <link rel="stylesheet" href="/assets/dashboard.css">
<style>
/* ---------------------------------------------------------------------------
   The answer, first and largest.
   Rule this follows: the status must be readable as a WORD before any colour
   registers, because colour alone is not a signal every reader can use. Hence a
   large label and a glyph, with colour as reinforcement rather than the message.
   --------------------------------------------------------------------------- */
.attention{border-radius:22px;padding:30px 32px 28px;margin-bottom:14px;border:1px solid;display:flex;flex-direction:column;gap:12px}
.attention.att-clear{border-color:rgba(94,234,190,.34);background:linear-gradient(180deg,rgba(16,86,70,.34),rgba(10,40,34,.22))}
.attention.att-warn{border-color:rgba(242,186,96,.42);background:linear-gradient(180deg,rgba(96,68,16,.36),rgba(52,36,10,.22))}
.attention.att-down{border-color:rgba(242,146,146,.46);background:linear-gradient(180deg,rgba(102,30,30,.38),rgba(56,16,16,.24))}

.att-status{display:flex;align-items:center;gap:11px}
.att-mark{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;
  font-size:15px;font-weight:700;line-height:1;border:2px solid currentColor}
.att-word{font-size:19px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.attention.att-clear .att-status{color:#8FEDD0}
.attention.att-warn .att-status{color:#FFCE86}
.attention.att-down .att-status{color:#FFAFAF}

.att-headline{font-size:clamp(28px,4.4vw,42px);line-height:1.1;font-weight:700;letter-spacing:-.025em;margin:0;color:#fff;text-wrap:balance}
.att-detail{margin:0;font-size:16px;line-height:1.65;color:rgba(233,240,248,.86);max-width:68ch}

.att-list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.att-item{display:flex;gap:13px;align-items:flex-start;background:rgba(255,255,255,.06);border-radius:12px;padding:13px 15px}
.att-sev{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:5px;white-space:nowrap;margin-top:1px}
.att-sev.att-warn{color:#FFCE86;background:rgba(242,186,96,.16)}
.att-sev.att-down{color:#FFAFAF;background:rgba(242,146,146,.18)}
.att-item-label{font-weight:600;color:#fff;font-size:15.5px}
.att-item-detail{font-size:13.5px;color:rgba(233,240,248,.74);margin-top:3px;line-height:1.55}

/* Metadata and controls: present, but never competing with the answer above. */
.metastrip{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 18px;border-radius:14px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.028)}
.ms-line{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-width:0;font-size:13px;color:rgba(203,213,225,.78)}
.ms-name{font-weight:700;color:#fff;font-size:14px;letter-spacing:-.01em}
.ms-sep{width:1px;height:14px;background:rgba(255,255,255,.14)}
.ms-fact{white-space:nowrap}
.ms-fact b{color:rgba(233,240,248,.95);font-weight:600}
.ms-controls{display:flex;align-items:center;gap:12px}
.ms-auto{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:rgba(203,213,225,.8);cursor:pointer}
.ms-auto input{width:15px;height:15px;accent-color:#5EEABE;cursor:pointer}
.ms-refresh{font-size:12.5px;font-weight:500;color:#BEF0E4;padding:6px 13px;border-radius:999px;
  border:1px solid rgba(94,234,190,.28);background:rgba(94,234,190,.1);cursor:pointer;white-space:nowrap}
.ms-refresh:hover:not(:disabled){border-color:rgba(94,234,190,.5);background:rgba(94,234,190,.16)}
.ms-refresh:disabled{opacity:.55;cursor:not-allowed}
.ms-refresh:focus-visible,.ms-auto input:focus-visible{outline:2px solid rgba(94,234,190,.6);outline-offset:2px}

.staff-list{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.staff-row{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.032)}
.staff-working{border-color:rgba(94,234,190,.3);background:rgba(16,86,70,.2)}
.staff-state{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 9px;border-radius:5px;white-space:nowrap;margin-top:2px;min-width:74px;text-align:center}
.staff-working .staff-state{color:#8FEDD0;background:rgba(94,234,190,.16)}
.staff-idle .staff-state{color:rgba(148,163,184,.9);background:rgba(148,163,184,.12)}
.staff-main{flex:1;min-width:0}
.staff-name{font-size:16px;font-weight:700;color:#fff;text-transform:capitalize;letter-spacing:-.01em}
.staff-activity{font-size:14px;color:rgba(226,232,240,.82);margin-top:2px}
.staff-msg{font-size:13px;color:rgba(203,213,225,.62);margin-top:5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.staff-facts{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-family:ui-monospace,Consolas,monospace;
  font-size:12px;color:rgba(203,213,225,.7);white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:640px){.staff-row{flex-wrap:wrap}.staff-facts{flex-direction:row;gap:10px;width:100%;justify-content:flex-start}}
.agent-strip{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12)}
.agent-kicker{font-family:ui-monospace,Consolas,monospace;font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:rgba(148,163,184,.85);margin-bottom:8px}
.agent-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.agent-row{display:flex;gap:10px;align-items:baseline;font-size:13.5px;color:rgba(226,232,240,.82)}
.agent-when{font-family:ui-monospace,Consolas,monospace;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;min-width:96px;color:rgba(148,163,184,.9)}
.stale-view{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:14px;padding:13px 18px;border-radius:14px;font-size:14px;line-height:1.5;border:1px solid rgba(242,146,146,.5);background:rgba(102,30,30,.34);color:#FFD9D9}
.stale-refresh{margin-left:auto;padding:5px 13px;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:600;border:1px solid rgba(255,217,217,.5);background:transparent;color:#FFD9D9}
.stale-refresh:hover{background:rgba(255,217,217,.12)}
.queue-list{display:flex;flex-direction:column;gap:10px}
.queue-row{display:flex;gap:12px;align-items:baseline}
.queue-pos{font-family:ui-monospace,Consolas,monospace;font-size:11px;font-weight:700;color:rgba(148,163,184,.9);min-width:20px;text-align:right}
.queue-title{font-size:14.5px;color:#E2E8F0}
.queue-title a{color:#8FEDD0;text-decoration:none}
.queue-title a:hover{text-decoration:underline}
.queue-why{font-size:12.5px;color:rgba(148,163,184,.95);margin-top:2px}
.queue-count{font-family:ui-monospace,Consolas,monospace;font-size:13px;color:rgba(148,163,184,.9)}
.queue-empty{font-size:14px;color:rgba(148,163,184,.95)}
.staff-role{margin-left:8px;font-family:ui-monospace,Consolas,monospace;font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(148,163,184,.9);border:1px solid rgba(148,163,184,.3);border-radius:4px;padding:1px 5px;vertical-align:middle}
.staff-row.staff-attention .staff-state{color:#FFCE86;border-color:rgba(242,186,96,.45);background:rgba(242,186,96,.12)}
.agent-live{display:inline-block;width:6px;height:6px;border-radius:50%;background:#5EEABE;margin-right:6px;vertical-align:middle;box-shadow:0 0 0 2px rgba(94,234,190,.22)}
.agent-stale{margin-top:10px;font-size:12.5px;line-height:1.5;color:#FFCE86;border-left:2px solid rgba(242,186,96,.55);padding-left:10px}
.agent-actor{font-weight:650;color:#fff;white-space:nowrap}
.agent-summary{flex:1;min-width:0}.att-item-link{color:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.35)}
.att-item-link:hover{text-decoration-color:currentColor}
.rm-group{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 0;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.12)}
.rm-group:first-of-type{margin-top:18px}
.rm-group-name{font-size:13px;font-weight:700;letter-spacing:.04em;color:#fff}
.rm-group-tally{font-family:ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:rgba(148,163,184,.9);white-space:nowrap}
.rm-group + .rm-list{margin-top:6px}
.rm-list{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.rm-row{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid rgba(255,255,255,.07);font-size:14.5px;color:rgba(226,232,240,.85)}
.rm-row:first-child{border-top:0}
.rm-status{font-family:ui-monospace,Consolas,monospace;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:2px 7px;border-radius:4px;min-width:62px;text-align:center;white-space:nowrap}
.rm-done .rm-status{color:#7ee0c0;background:rgba(94,234,190,.13)}
.rm-active .rm-status{color:#f2c274;background:rgba(240,180,88,.15)}
.rm-planned .rm-status{color:rgba(148,163,184,.9);background:rgba(148,163,184,.12)}
.rm-ms{font-family:ui-monospace,Consolas,monospace;font-size:12px;font-weight:600;color:#fff;min-width:34px}
.rm-title{flex:1;min-width:0}
.rm-done .rm-title{color:rgba(226,232,240,.62)}

/* ---------------------------------------------------------------------------
   Compact layout.
   The page is read at a glance, several times an hour, on a machine where it
   shares a screen with the work. It was built to be scrolled: a 42px headline, a
   third of the fold spent on one sentence, and 24px of padding around every
   panel. Density here is not decoration - what fits above the fold is what gets
   read, and the answer, the team and the queue should all fit.
   Nothing is made smaller than it can be read at. Body text stays at 13px and
   up, every status keeps its word as well as its colour, and the hero is still
   the largest thing on the page - just no longer the only thing on it.
   Overrides live here rather than in dashboard.css because that file is Tailwind
   output and hand edits to it are lost on the next build.
   --------------------------------------------------------------------------- */
.dashboard-shell{padding:14px 16px}
@media (min-width:640px){.dashboard-shell{padding-left:20px;padding-right:20px}}
@media (min-width:1024px){.dashboard-shell{padding-left:24px;padding-right:24px}}

.attention{padding:18px 20px 16px;border-radius:16px;gap:8px;margin-bottom:10px}
.att-headline{font-size:clamp(21px,2.6vw,30px);line-height:1.15}
.att-detail{font-size:14px;line-height:1.5}
.att-word{font-size:15px}
.att-mark{width:24px;height:24px;font-size:13px}
.att-list{gap:6px}
.att-item{padding:9px 12px}
.agent-strip{margin-top:12px;padding-top:10px}
.agent-row{font-size:13px}

.panel{border-radius:16px}
.panel .panel-body{padding:16px}
@media (min-width:640px){.panel .panel-body{padding:18px}}
.section-kicker{font-size:10.5px;letter-spacing:.22em}
.section-title{margin-top:4px;font-size:19px;line-height:1.25}
@media (min-width:640px){.section-title{font-size:21px}}

main.grid{gap:14px;margin-top:14px}
.space-y-6>:not([hidden])~:not([hidden]){margin-top:14px}
.dashboard-shell>#workflow-editor{margin-top:14px}
.dashboard-shell>#dashboard-alert{margin-top:10px}
main .grid{gap:14px}

.metric-card{border-radius:16px;padding:14px}
@media (min-width:640px){.metric-card{padding:16px}}
.metric-value{margin-top:4px;font-size:24px;line-height:1.2}
@media (min-width:640px){.metric-value{font-size:26px}}
.metric-label{font-size:13px}
.metric-detail{margin-top:4px;font-size:12.5px}

.staff-row{padding:10px 12px;border-radius:11px;gap:11px}
.staff-name{font-size:14.5px}
.staff-activity{font-size:13px}
.queue-list{gap:7px}
.queue-title{font-size:13.5px}

.sec-toggle{font-size:11.5px;font-weight:600;letter-spacing:.04em;padding:4px 11px;border-radius:999px;
  border:1px solid rgba(148,163,184,.32);background:transparent;color:rgba(203,213,225,.95);cursor:pointer;white-space:nowrap}
.sec-toggle:hover{border-color:rgba(165,243,252,.45);color:#CFFAFE}
.rm-list{gap:5px}
.rm-group{margin-top:10px}

/* ---------------------------------------------------------------------------
   Reading structure.
   Measured on a 1280px window: the hero paragraph ran at 73 characters a line
   because someone capped it at 513px, and everything else ran at 125-156 because
   nothing else was capped at all. Comfortable measure is 45-75; the page was at
   roughly double it, and worse on a wider monitor, which is why it read as a wall
   rather than as lines. Tailwind is not the cause - w-full is easy to write and
   nothing in it asks about measure.
   The layout stays wide, because the columns use that width. Only the PROSE is
   capped, so a line ends where the eye expects it to.
   Hierarchy is the other half: a row now has a fixed leading column to scan down,
   one thing at title weight, and anything supporting it visibly lighter. Where
   everything is the same weight, nothing is a heading.
   --------------------------------------------------------------------------- */
.att-item-detail,
.agent-summary,
.staff-activity,
.staff-msg,
.queue-why,
.metric-detail{max-width:72ch}
.att-detail{max-width:72ch}
.rm-row-title{max-width:72ch}

/* One thing at title weight per row, everything else demoted. */
.staff-name{font-weight:600;color:#F1F5F9;letter-spacing:-.01em}
.staff-activity{color:rgba(203,213,225,.82)}
.staff-msg{color:rgba(148,163,184,.85);font-size:12.5px}
.att-item-title{font-weight:600;color:#fff}
.att-item-detail{color:rgba(226,232,240,.78);line-height:1.5}
.queue-title{font-weight:500}
.queue-why{color:rgba(148,163,184,.9)}

/* A fixed leading column so the eye scans one edge instead of a ragged one. */
.agent-when{min-width:104px}
.staff-state{min-width:74px;text-align:center}
.queue-pos{min-width:22px}
</style>
</head>
<body>
  <div class="pointer-events-none fixed inset-0 overflow-hidden">
    <div class="absolute inset-0 mesh-overlay opacity-30"></div>
    <div class="absolute -left-20 top-24 h-72 w-72 rounded-full bg-cyan-400/10 blur-3xl animate-drift"></div>
    <div class="absolute right-0 top-10 h-80 w-80 rounded-full bg-emerald-400/10 blur-3xl animate-drift"></div>
    <div class="absolute bottom-0 left-1/2 h-96 w-96 -translate-x-1/2 rounded-full bg-orange-400/10 blur-3xl animate-drift"></div>
  </div>

  <div class="relative min-h-screen">
    <div class="dashboard-shell">
      <div id="staleness-banner"></div>
      <header id="hero-panel" class="panel animate-lift"></header>
      <div id="dashboard-alert" class="mt-4"></div>
      <section id="workflow-editor" class="panel mt-6"></section>

      <!-- Panels sit side by side rather than stacked. The two grids here used to
           declare two columns and hold one child each, left over from panels that
           were removed, so every band ran the full width and the page was four
           screens taller than its content. -->
      <main class="mt-6 grid gap-6 xl:grid-cols-[minmax(0,1.35fr)_420px] xl:items-start">
        <section class="space-y-6">
          <div class="grid gap-6 lg:grid-cols-2 lg:items-start">
            <section id="live-runs" class="panel"></section>
            <section id="activity-feed" class="panel"></section>
          </div>
          <section id="roadmap-panel" class="panel"></section>
        </section>

        <aside class="dashboard-rail space-y-6">
          <section id="instance-status" class="panel"></section>
          <section id="rate-limits" class="panel"></section>
        </aside>
      </main>
    </div>
  </div>

  <noscript>
    <div class="mx-auto max-w-3xl px-4 py-10 text-sm text-slate-200">
      Symphony Watchtower requires JavaScript to render live runtime state.
    </div>
  </noscript>

  <script type="module" src="/assets/dashboard.js"></script>
</body>
</html>
