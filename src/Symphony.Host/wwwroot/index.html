<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#04121A">
  <title>Symphony Watchtower</title>
  <link rel="stylesheet" href="/assets/dashboard.css">
<style>
/* ===========================================================================
   Watchtower - operations dashboard.

   One rule above the rest: the page answers "does this need me?" before
   anything else is read, and everything below that is ordered by how likely it
   is to change what the reader does next.

   ACCESSIBILITY, NON-NEGOTIABLE. The reader is colour-weak. No state is ever
   carried by colour alone: every badge contains a word, every status dot sits
   beside its label, and severity also changes a glyph. Colour is reinforcement,
   never the message.

   Density is deliberate. This is read many times an hour, for seconds, beside
   the work it describes - so the whole picture fits in roughly two screens
   rather than seven, and prose is capped near 72 characters so a line ends
   where the eye expects.
   =========================================================================== */

:root{
  --wt-bg:#04121A;
  --wt-panel:#08202B;
  --wt-panel-2:rgba(255,255,255,.032);
  --wt-line:rgba(126,166,182,.20);
  --wt-line-soft:rgba(126,166,182,.12);
  --wt-ink:#EAF2F5;
  --wt-ink-2:rgba(206,224,231,.80);
  --wt-ink-3:rgba(150,176,187,.85);
  --wt-attn:#F0B94F;
  --wt-attn-bg:rgba(240,185,79,.12);
  --wt-attn-line:rgba(240,185,79,.55);
  --wt-bad:#F08A8A;
  --wt-bad-bg:rgba(240,138,138,.12);
  --wt-ok:#43D9A3;
  --wt-ok-bg:rgba(67,217,163,.12);
  --wt-accent:#6FD3E0;
  --wt-mono:ui-monospace,Consolas,"SF Mono",monospace;
  --wt-radius:14px;
}

body{background:var(--wt-bg);color:var(--wt-ink);
  font-family:Aptos,"Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.45;background-image:none}

.wt-shell{max-width:1720px;margin:0 auto;padding:16px 20px 24px;display:flex;flex-direction:column;gap:14px}
.wt-ico{flex:none;display:inline-block;vertical-align:-2px}

/* ---------- header ---------- */
.wt-header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.wt-brand{display:flex;align-items:center;gap:12px;min-width:0}
.wt-mark{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(67,217,163,.38);background:rgba(67,217,163,.12);color:var(--wt-ok);flex:none}
.wt-title{font-size:26px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.wt-live{font-size:12px;font-weight:700;letter-spacing:.10em;padding:5px 12px;border-radius:8px;
  border:1px solid rgba(67,217,163,.5);background:var(--wt-ok-bg);color:var(--wt-ok)}
.wt-live.is-stale{border-color:rgba(240,138,138,.55);background:var(--wt-bad-bg);color:var(--wt-bad)}
.wt-head-right{display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--wt-ink-2)}

/* A real switch, not a checkbox: the header reads as a control panel, and the
   knob position says on/off without relying on the fill colour. */
.wt-switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;white-space:nowrap}
.wt-switch input{position:absolute;opacity:0;width:0;height:0}
.wt-track{width:42px;height:23px;border-radius:999px;background:rgba(255,255,255,.10);
  border:1px solid var(--wt-line);position:relative;transition:background .15s,border-color .15s;flex:none}
.wt-track::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;
  background:#CFE0E6;transition:transform .15s}
.wt-switch input:checked + .wt-track{background:#28B98C;border-color:#28B98C}
.wt-switch input:checked + .wt-track::after{transform:translateX(19px);background:#062018}
.wt-switch input:focus-visible + .wt-track{outline:2px solid var(--wt-accent);outline-offset:2px}

.wt-btn{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:8px 15px;
  border-radius:10px;border:1px solid var(--wt-line);background:rgba(255,255,255,.05);color:var(--wt-ink);cursor:pointer}
.wt-btn:hover{border-color:rgba(67,217,163,.45);background:rgba(67,217,163,.10)}
.wt-btn:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--wt-accent);outline-offset:2px}
.wt-stamp{text-align:right;line-height:1.35}
.wt-stamp b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--wt-ink-3);font-weight:600}
.wt-stamp span{font-size:13px;color:var(--wt-ink-2)}

/* ---------- grid ---------- */
.wt-grid{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:1180px){
  .wt-grid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
}

.wt-panel{border:1px solid var(--wt-line);border-radius:var(--wt-radius);background:var(--wt-panel);
  padding:16px 18px;min-width:0;display:flex;flex-direction:column;gap:12px}
.wt-panel.is-attn{border-color:var(--wt-attn-line);
  background:linear-gradient(180deg,rgba(240,185,79,.06),transparent 55%),var(--wt-panel)}
.wt-panel.is-bad{border-color:rgba(240,138,138,.55);
  background:linear-gradient(180deg,rgba(240,138,138,.06),transparent 55%),var(--wt-panel)}

.wt-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.wt-h{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--wt-ink-2)}
.wt-h .wt-ico{color:var(--wt-ink-3)}
.wt-count{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--wt-line);color:var(--wt-ink-2)}
.wt-headmeta{display:flex;align-items:center;gap:18px;font-size:12.5px;color:var(--wt-ink-3);flex-wrap:wrap}
.wt-headmeta b{font-weight:600;color:var(--wt-ink-2)}

/* A dot is decoration; the word beside it is the signal. Never one without the
   other - the reader cannot tell these three colours apart. */
.wt-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--wt-ink-3)}
.wt-dot.is-ok{background:var(--wt-ok)}
.wt-dot.is-attn{background:var(--wt-attn)}
.wt-dot.is-bad{background:var(--wt-bad)}

/* ---------- attention ---------- */
.wt-attn-top{display:flex;gap:14px;align-items:flex-start}
.wt-attn-glyph{flex:none;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:3px solid currentColor}
.wt-attn-eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--wt-attn)}
.wt-panel.is-ok .wt-attn-eyebrow{color:var(--wt-ok)}
.wt-attn-headline{font-size:27px;font-weight:700;letter-spacing:-.025em;line-height:1.12;margin:3px 0 4px;text-wrap:balance}
.wt-attn-sub{font-size:13.5px;color:var(--wt-ink-2);max-width:72ch}

/* ---------- rows shared by attention and queue ---------- */
.wt-items{display:flex;flex-direction:column;gap:6px}
.wt-item{display:flex;gap:14px;align-items:center;padding:11px 13px;border-radius:11px;
  border:1px solid var(--wt-line-soft);background:var(--wt-panel-2)}
.wt-item.sev-attention{background:linear-gradient(90deg,rgba(240,185,79,.07),transparent 40%),var(--wt-panel-2)}
.wt-item.sev-down{background:linear-gradient(90deg,rgba(240,138,138,.07),transparent 40%),var(--wt-panel-2)}
.wt-badge{flex:none;display:inline-flex;align-items:center;justify-content:center;text-align:center;
  font-size:10.5px;font-weight:700;letter-spacing:.09em;padding:6px 9px;border-radius:7px;
  border:1px solid var(--wt-line);color:var(--wt-ink-3);background:rgba(255,255,255,.03)}
.wt-badge.is-block{width:94px;line-height:1.25}
.wt-badge.sev-attention{border-color:var(--wt-attn-line);background:var(--wt-attn-bg);color:var(--wt-attn)}
.wt-badge.sev-down{border-color:rgba(240,138,138,.5);background:var(--wt-bad-bg);color:var(--wt-bad)}
.wt-badge.sev-ok{border-color:rgba(67,217,163,.5);background:var(--wt-ok-bg);color:var(--wt-ok)}
.wt-item.is-tight{padding:7px 12px}
/* One line, ellipsised. The full text is on the row's tooltip and printed in
   full in the queue panel, so clipping here hides nothing. */
.wt-clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt-item-body{min-width:0;flex:1}
.wt-item-title{font-size:14px;font-weight:600;color:var(--wt-ink)}
.wt-item-why{font-size:13px;color:var(--wt-ink-2);margin-top:2px;max-width:72ch}
.wt-item-right{flex:none;display:flex;align-items:center;gap:10px}
.wt-pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:6px 11px;
  border-radius:999px;border:1px solid var(--wt-line);color:var(--wt-ink-2);white-space:nowrap}
.wt-pill.sev-attention{border-color:var(--wt-attn-line);background:var(--wt-attn-bg);color:var(--wt-attn)}
.wt-pill.sev-down{border-color:rgba(240,138,138,.5);background:var(--wt-bad-bg);color:var(--wt-bad)}
.wt-pill.sev-ok{border-color:rgba(67,217,163,.5);background:var(--wt-ok-bg);color:var(--wt-ok)}
.wt-chev{color:var(--wt-ink-3);text-decoration:none;display:inline-flex;align-items:center}
.wt-chev:hover{color:var(--wt-ink)}
.wt-badge.is-actor{letter-spacing:.1em}
/* Items that are not the owner's sit under a quiet rule rather than being mixed
   in - they are context for why work is or is not moving, not a to-do list. */
.wt-subhead{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--wt-ink-3);padding:8px 2px 2px;border-top:1px solid var(--wt-line-soft);margin-top:4px}
.wt-empty{font-size:13px;color:var(--wt-ink-3)}

/* ---------- health ---------- */
.wt-health-line{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wt-health-state{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600}
.wt-health-sub{font-size:12.5px;color:var(--wt-ink-3)}
.wt-sub-h{font-size:12.5px;font-weight:700;color:var(--wt-ink-2)}
.wt-sub-h span{font-weight:400;color:var(--wt-ink-3)}
.wt-sched{display:flex;flex-direction:column;gap:8px}
.wt-sched-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;
  border:1px solid var(--wt-line-soft);background:var(--wt-panel-2)}
.wt-sched-ico{flex:none;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--wt-line);background:rgba(255,255,255,.03);color:var(--wt-ink-3)}
.wt-sched-main{flex:1;min-width:0}
.wt-sched-name{font-size:13.5px;font-weight:600}
.wt-sched-why{font-size:12px;color:var(--wt-ink-3);margin-top:1px;max-width:72ch}
.wt-sched-right{text-align:right;flex:none;line-height:1.35}
.wt-sched-state{font-size:13px;font-weight:600}
.wt-sched-state.is-ok{color:var(--wt-ok)}
.wt-sched-state.is-run{color:var(--wt-accent)}
.wt-sched-state.is-bad{color:var(--wt-bad)}
.wt-sched-every{font-size:11.5px;color:var(--wt-ink-3)}

/* ---------- team table ---------- */
.wt-table{width:100%;border-collapse:collapse;font-size:13.5px}
.wt-table th{text-align:left;font-size:11px;font-weight:600;color:var(--wt-ink-3);
  padding:0 10px 8px;border-bottom:1px solid var(--wt-line-soft)}
.wt-table td{padding:9px 10px;border-bottom:1px solid var(--wt-line-soft);vertical-align:middle}
.wt-table tr:last-child td{border-bottom:0}
.wt-table td.wt-num{font-size:12.5px;color:var(--wt-ink-3);text-align:right;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.wt-agent{display:flex;align-items:center;gap:10px;min-width:0}
.wt-who{display:flex;flex-direction:column;min-width:0}
.wt-who b{font-weight:600;font-size:13.5px}
.wt-who span{font-size:11.5px;color:var(--wt-ink-3);text-transform:capitalize}
.wt-act{color:var(--wt-ink-2);max-width:72ch}
.wt-avatar{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:9.5px;font-weight:700;letter-spacing:.02em;border:1px solid var(--wt-line);background:rgba(255,255,255,.05);color:var(--wt-ink-2)}
.wt-avatar.is-claude{border-color:rgba(150,130,235,.55);background:rgba(150,130,235,.16);color:#C6B8FF}
.wt-avatar.is-codex{border-color:rgba(111,211,224,.5);background:rgba(111,211,224,.14);color:#9FE3EC}
.wt-avatar.is-owner{border-color:rgba(240,185,79,.5);background:var(--wt-attn-bg);color:var(--wt-attn)}

/* ---------- activity ---------- */
.wt-feed{display:flex;flex-direction:column;gap:2px}
.wt-frow{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--wt-line-soft)}
.wt-frow:last-child{border-bottom:0}
.wt-fbody{flex:1;min-width:0}
.wt-fsum{font-size:13px;color:var(--wt-ink-2);max-width:72ch}
.wt-ftime{flex:none;text-align:right;line-height:1.3;font-variant-numeric:tabular-nums}
.wt-ftime b{display:block;font-size:12.5px;font-weight:600;color:var(--wt-ink-2)}
.wt-ftime span{font-size:11.5px;color:var(--wt-ink-3)}
.wt-fopen{flex:none;color:var(--wt-ink-3);display:inline-flex;align-items:center}
.wt-fopen:hover{color:var(--wt-ink)}

/* ---------- roadmap ---------- */
.wt-proj{display:flex;flex-direction:column;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--wt-line-soft)}
.wt-proj:last-child{border-bottom:0;padding-bottom:0}
.wt-proj-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* The disclosure is a real control, not an ornament: it was drawn as a chevron
   and did nothing, which taught the reader the panel had no detail to give. */
.wt-disc{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;
  color:inherit;cursor:pointer;font:inherit;text-align:left}
.wt-disc-ico{display:inline-flex;color:var(--wt-ink-3);transition:transform .12s}
.wt-disc-ico.is-open{transform:rotate(90deg)}
.wt-disc:hover .wt-disc-ico{color:var(--wt-ink)}
.wt-proj-name{font-size:14.5px;font-weight:600}
.wt-proj-sum{font-size:12.5px;color:var(--wt-ink-2);max-width:72ch}
.wt-proj-sum b{color:var(--wt-ink);font-weight:600}
.wt-stage-list{display:flex;flex-direction:column;gap:7px;padding:10px 0 2px;
  border-top:1px solid var(--wt-line-soft)}
.wt-stage{display:flex;gap:11px;align-items:flex-start}
.wt-stage .wt-step-dot{width:24px;height:24px;font-size:11px}
.wt-stage-txt{min-width:0}
.wt-stage-txt b{font-size:12.5px;font-weight:600}
.wt-stage-status{font-size:11px;margin-left:8px;color:var(--wt-ink-3)}
.wt-stage.is-done .wt-stage-status{color:var(--wt-ok)}
.wt-stage.is-active .wt-stage-status{color:var(--wt-attn)}
.wt-stage-why{font-size:12px;color:var(--wt-ink-2);max-width:72ch;margin-top:1px}
.wt-proj-tag{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:6px;
  border:1px solid rgba(111,211,224,.4);background:rgba(111,211,224,.12);color:var(--wt-accent)}
.wt-steps{display:flex;align-items:flex-start;gap:0;flex-wrap:wrap;row-gap:12px}
.wt-step{display:flex;align-items:center;gap:10px;min-width:0}
.wt-step-dot{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;border:1.5px solid var(--wt-line);color:var(--wt-ink-3);background:rgba(255,255,255,.03)}
.wt-step.is-done .wt-step-dot{border-color:rgba(67,217,163,.6);background:var(--wt-ok-bg);color:var(--wt-ok)}
.wt-step.is-active .wt-step-dot{border-color:var(--wt-attn-line);background:var(--wt-attn-bg);color:var(--wt-attn)}
.wt-step-txt{display:flex;flex-direction:column;min-width:0}
.wt-step-txt b{font-size:12.5px;font-weight:600;white-space:nowrap}
.wt-step-txt span{font-size:11.5px;color:var(--wt-ink-3);white-space:nowrap}
.wt-step.is-done .wt-step-txt span{color:var(--wt-ok)}
.wt-step.is-active .wt-step-txt span{color:var(--wt-attn)}
.wt-step-bar{flex:none;width:32px;height:1.5px;background:var(--wt-line);margin:0 10px}
.wt-proj-foot{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--wt-ink-3)}
.wt-tally{display:inline-flex;align-items:center;gap:7px;color:var(--wt-ink-2)}

/* ---------- footer strip ---------- */
.wt-utility{display:grid;gap:12px;grid-template-columns:1fr;border:1px solid var(--wt-line-soft);
  border-radius:var(--wt-radius);background:rgba(255,255,255,.022);padding:12px 18px;font-size:12.5px}
@media (min-width:900px){.wt-utility{grid-template-columns:minmax(0,1fr) auto;align-items:center}}
.wt-strip{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.wt-strip-h{font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--wt-ink-3)}
.wt-svc-item{display:inline-flex;align-items:center;gap:7px;color:var(--wt-ink-2)}
.wt-lim{justify-content:flex-end}
.wt-bar{width:130px;height:7px;border-radius:999px;background:rgba(255,255,255,.10);overflow:hidden;flex:none}
.wt-bar i{display:block;height:100%;background:#43D9A3}
.wt-bar.is-high i{background:#F0B94F}
.wt-bar.is-full i{background:#F08A8A}
.wt-lim-num{font-variant-numeric:tabular-nums;color:var(--wt-ink-2)}

/* ---------- advanced ---------- */
.wt-adv{border:1px solid var(--wt-line-soft);border-radius:var(--wt-radius);background:rgba(255,255,255,.015);padding:12px 18px}
.wt-adv-body{margin-top:12px;display:flex;flex-direction:column;gap:14px}

.wt-link{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
  color:var(--wt-accent);text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.wt-link:hover{text-decoration:underline}
.wt-foot-link{padding-top:4px;display:flex;justify-content:center}
.wt-mono{font-family:var(--wt-mono)}

/* ---------- stale banner ---------- */
.stale-view{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 16px;border-radius:var(--wt-radius);
  font-size:13.5px;border:1px solid rgba(240,138,138,.55);background:var(--wt-bad-bg);color:#FFDCDC}
.stale-refresh{margin-left:auto;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:600;
  border:1px solid rgba(255,220,220,.5);background:transparent;color:#FFDCDC}
.stale-refresh:hover{background:rgba(255,220,220,.12)}
</style>
</head>
<body>
  <div class="wt-shell">

    <header class="wt-header">
      <div class="wt-brand">
        <span class="wt-mark" aria-hidden="true">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </span>
        <span class="wt-title">Symphony Watchtower</span>
        <span id="live-badge" class="wt-live">LIVE</span>
      </div>
      <div id="header-right" class="wt-head-right"></div>
    </header>

    <div id="staleness-banner"></div>

    <main class="wt-grid">
      <section id="panel-attention" class="wt-panel"></section>
      <section id="panel-health" class="wt-panel"></section>
      <section id="panel-team" class="wt-panel"></section>
      <section id="panel-activity" class="wt-panel"></section>
      <section id="panel-queue" class="wt-panel"></section>
      <section id="panel-roadmap" class="wt-panel"></section>
    </main>

    <footer id="panel-utility" class="wt-utility"></footer>

    <section id="panel-advanced" class="wt-adv"></section>

    <div id="dashboard-alert"></div>
  </div>

  <noscript>
    <div style="max-width:48rem;margin:0 auto;padding:2.5rem 1rem;font-size:.875rem;color:#e2e8f0">
      Symphony Watchtower requires JavaScript to render live runtime state.
    </div>
  </noscript>

  <script type="module" src="/assets/dashboard.js"></script>
</body>
</html>
