name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Symphony.slnx

      - name: Build
        run: dotnet build Symphony.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Symphony.slnx --configuration Release --no-build

      # The snapshot builder is coupled to the renderer on purpose and aborts
      # when the coupling moves. It aborted for two days without anyone seeing
      # it, because the only thing that ran it was an unattended publisher whose
      # silence looked like calm. It runs here now, on the change that would
      # break it, where the failure has a reader.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Watchtower snapshot couplings
        run: python scripts/build_watchtower_snapshot.py --check

      - name: Watchtower snapshot builder tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v
